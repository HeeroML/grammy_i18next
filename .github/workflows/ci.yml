name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    ok:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x
            - name: Format, lint, test, and type-check
              run: deno task ok
            - name: Validate JSR publishing
              run: deno publish --dry-run
